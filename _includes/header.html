{% assign home_path = page.preview_home | default: '/' %}
<header class="site-header" role="banner">
    <div class="wrapper">
        <a class="site-title" rel="author" href="{{ home_path | relative_url }}">{{ site.title | escape }}</a>

        <nav class="site-nav" aria-label="Primary navigation">
            <input type="checkbox" id="nav-trigger" class="nav-trigger">
            <label for="nav-trigger">
                <span class="menu-icon" aria-label="Open navigation">
                    <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
                        <path d="M18,1.484c0,.82-.665,1.484-1.484,1.484H1.484C.665,2.969,0,2.304,0,1.484S.665,0,1.484,0h15.032C17.335,0,18,.665,18,1.484ZM18,7.516C18,8.335,17.335,9,16.516,9H1.484C.665,9,0,8.335,0,7.516s.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516ZM18,13.516C18,14.335,17.335,15,16.516,15H1.484C.665,15,0,14.335,0,13.516s.665-1.483,1.484-1.483h15.032C17.335,12.031,18,12.695,18,13.516Z"/>
                    </svg>
                </span>
            </label>

            <div class="trigger">
                <a class="page-link" href="{{ home_path | relative_url }}"{% if page.url == home_path %} aria-current="page"{% endif %}>Home</a>
                <a class="page-link" href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} aria-current="page"{% endif %}>Publications</a>
                <a class="page-link" href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Notes</a>
            </div>
        </nav>
    </div>
</header>
